[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seaborn-image"
version = "0.10.1"
description = "Attractive, descriptive and effective image visualization with seaborn-like API built on top of matplotlib"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Sarthak Jariwala", email = "contact@sarthakjariwala.com" }]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26",
    "scikit-image>=0.17.2",
    "matplotlib-scalebar>=0.7.0,<0.9.0",
    "palettable>=3.3.0",
    "scipy>=1.5.1",
    "pooch>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/SarthakJariwala/seaborn-image"
Repository = "https://github.com/SarthakJariwala/seaborn-image"
Documentation = "https://seaborn-image.readthedocs.io/"

[dependency-groups]
test = [
    "pytest>=7.1.2",
    "pytest-cov>=2.10.1",
    "coverage[toml]>=6.3",
    "xdoctest[colors]>=0.15.10",
    "pygments",
]
docs = [
    "sphinx>=4.3.2",
    "sphinx-gallery>=0.9.0",
    "nbsphinx>=0.8.0",
    "pydata-sphinx-theme>=0.7.2",
    "ipykernel>=6.15.2",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "black>=20.8b1",
    "flake8-docstrings>=1.5.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
only-include = ["src/seaborn_image"]
