name: Tests
on:
  - push
  - pull_request
jobs:
  tests:
    name: ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          - { python-version: "3.14", os: ubuntu-latest }
          - { python-version: "3.13", os: windows-latest }
          - { python-version: "3.13", os: macos-latest }

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run pytest
      - run: uv run python -m xdoctest --modname=seaborn_image --command=all
