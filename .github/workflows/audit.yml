name: Audit
on:
  - push
  - pull_request
jobs:
  audit:
    name: uv audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv audit --frozen --preview-features audit-command
